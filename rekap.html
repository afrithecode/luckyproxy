<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Pembelian Proxy Bulanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: system-ui; }
        .glass { background: rgba(15,23,42,0.7); backdrop-filter: blur(12px); }
        .hidden-section { display: none; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

<div class="max-w-4xl mx-auto">

    <!-- HALAMAN LOGIN -->
    <div id="loginSection">
        <div class="glass rounded-3xl p-8 border border-emerald-500/20 max-w-md mx-auto">
            <h2 class="text-2xl font-bold text-white mb-6">🔐 Akses Rekap Pembelian</h2>
            <input type="password" id="kodeAkses" placeholder="Masukkan Kode Owner"
                class="w-full px-4 py-3 rounded-xl bg-gray-800/50 border border-gray-700 text-white mb-4">
            <button onclick="bukaRekap()"
                class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold">
                Lihat Semua Data
            </button>
        </div>
    </div>

    <!-- HALAMAN REKAP -->
    <div id="rekapSection" class="hidden-section">
        <h1 class="text-3xl font-bold text-center mb-8">📋 Rekap Pembelian Proxy</h1>
        
        <!-- TABEL -->
        <div class="glass rounded-3xl p-6 border border-emerald-500/20">
            <div class="grid grid-cols-4 gap-4 pb-3 border-b border-gray-700 font-bold">
                <div>Nama Pembeli</div>
                <div>Produk</div>
                <div>Harga</div>
                <div>Tanggal</div>
            </div>
            <div id="daftarRekap"></div>
        </div>
    </div>
</div>

<script>
// === 🔑 PENGATURAN ===
const URL_SERVER = 'https://script.google.com/d/1S4x1PXMPcEquu8OCc0x2VdRIWzXmP2B4ob7HJrt_4clKjZwgO0N4BGZx/edit?usp=sharing'; // Ganti dengan URL dari Google Apps Script
const KODE_OWNER = 'ADMIN123'; // Ganti kode rahasia kamu

document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const nama = params.get('nama');
    const produk = params.get('produk') || 'Proxy Bulanan';
    const harga = params.get('harga') || '50.000';

    // === PEMBELI: Simpan data ke server ===
    if (nama) {
        await simpanKeServer(nama, produk, harga);
        document.body.innerHTML = `
            <div class="max-w-md mx-auto mt-20 p-6 text-center glass rounded-3xl border border-emerald-500/20">
                <h2 class="text-2xl font-bold text-emerald-400 mb-4">✅ Terima Kasih!</h2>
                <p class="text-lg">Halo, <strong>${nama}</strong>!</p>
                <p class="text-gray-400">Data pembelian sudah tercatat di server.</p>
            </div>`;
    }
});

// === SIMPAN DATA KE SERVER ===
async function simpanKeServer(nama, produk, harga) {
    await fetch(URL_SERVER, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            nama, produk, harga,
            tanggal: new Date().toLocaleDateString('id-ID')
        })
    });
}

// === BUKA REKAP UNTUK OWNER ===
async function bukaRekap() {
    const kode = document.getElementById('kodeAkses').value;
    if (kode !== KODE_OWNER) return alert('Kode salah!');

    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('rekapSection').classList.remove('hidden-section');

    // Ambil semua data dari server
    const res = await fetch(URL_SERVER);
    const data = await res.json();
    const wadah = document.getElementById('daftarRekap');

    wadah.innerHTML = data.map(item => `
        <div class="grid grid-cols-4 gap-4 py-3 border-b border-gray-700 text-sm">
            <div class="font-bold">${item[0]}</div>
            <div>${item[1]}</div>
            <div>Rp ${item[2]}</div>
            <div>${item[3]}</div>
        </div>
    `).join('');
}
</script>
</body>
</html>
